name: Publish LIRA8 v0.27 GOLD binary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v027-gold-binary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download verified GOLD artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/LIRA8-v027-GOLD.zip 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b8ac-820e-bf7b-bb9c87d0d8b3/raw?se=2026-10-13T14%3A50%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=e3f78ec7-3b63-5fde-bcd0-94176f539a78&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T07%3A53%3A25Z&ske=2026-10-14T07%3A53%3A25Z&sks=b&skv=2026-02-06&sig=nhQsnCFJEzv2fYC%2B7MZ7gJz7YcjliFeossDlVZBt/qo%3D'
          echo '882ba257d76d98df6a3a8e1462a3c25dd4dbbb7a293009b40b21157f86ca3901  /tmp/LIRA8-v027-GOLD.zip' | sha256sum -c -
          rm -rf /tmp/lira8-v027 && mkdir -p /tmp/lira8-v027
          unzip -q /tmp/LIRA8-v027-GOLD.zip -d /tmp/lira8-v027
          echo 'ff4785d811fc94aabfd24a5ec1d7a5cc4e0b7f193d7c568313f33d3a98d98f79  /tmp/lira8-v027/LIRA8-ANDROID-v0.27-GOLD.apk' | sha256sum -c -
          cp /tmp/lira8-v027/LIRA8-ANDROID-v0.27-GOLD.apk downloads/LIRA8-ANDROID-v0.27-GOLD.apk

      - name: Commit GOLD APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-v0.27-GOLD.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Publish LIRA8 v0.27 GOLD APK'
          git push origin HEAD:main
