name: Publish verified LIRA8 install fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-install-fix.yml'
      - '.release-public-v020/install-fix-v2-signing-block.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact APK that passed phone install test
        shell: bash
        run: |
          set -euo pipefail
          GOLD='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          OUT='/tmp/LIRA8-v0.20-INSTALL-FIX.apk'
          BLOCK='.release-public-v020/install-fix-v2-signing-block.b64'
          EXPECTED_UNSIGNED='f5b9147421f8b837d091286e7e369fd210d3b9ebf13b6cc13beb646c8daed430'
          EXPECTED_FINAL='813cd4325c99f845e294686b1fd93782af48ce87790b9966b52a576897f37d59'

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 "$GOLD" /tmp/aligned.apk
          echo "$EXPECTED_UNSIGNED  /tmp/aligned.apk" | sha256sum -c -
          base64 -d "$BLOCK" > /tmp/v2block.bin

          python3 - <<'PY'
          from pathlib import Path
          import struct
          src=Path('/tmp/aligned.apk')
          out=Path('/tmp/LIRA8-v0.20-INSTALL-FIX.apk')
          data=src.read_bytes()
          block=Path('/tmp/v2block.bin').read_bytes()
          if b'APK Sig Block 42' in data:
              raise SystemExit('aligned source unexpectedly already contains an APK signing block')
          eocd=data.rfind(b'PK\x05\x06', max(0, len(data)-65557))
          if eocd < 0:
              raise SystemExit('EOCD not found')
          comment_len=struct.unpack_from('<H', data, eocd+20)[0]
          if eocd+22+comment_len != len(data):
              raise SystemExit('EOCD is not final record')
          cd_size=struct.unpack_from('<I', data, eocd+12)[0]
          cd_off=struct.unpack_from('<I', data, eocd+16)[0]
          if cd_off+cd_size != eocd:
              raise SystemExit('Central directory layout mismatch')
          result=bytearray(data[:cd_off] + block + data[cd_off:])
          new_eocd=eocd+len(block)
          struct.pack_into('<I', result, new_eocd+16, cd_off+len(block))
          out.write_bytes(result)
          PY

          echo "$EXPECTED_FINAL  $OUT" | sha256sum -c -
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          "$ZIPALIGN" -c -v 4 "$OUT"

      - name: Publish APK and site metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk'
          cp /tmp/LIRA8-v0.20-INSTALL-FIX.apk "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$APK" > SHA256.txt

          python3 - "$SHA" <<'PY'
          from pathlib import Path
          import re,sys
          sha=sys.argv[1]
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r"const APK_URL='[^']+';", "const APK_URL='downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk';", s)
          s=re.sub(r"const APK_NAME='[^']+';", "const APK_NAME='LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk';", s)
          s=re.sub(r'(?i)(SHA-256[^0-9a-fA-F]*)([0-9a-fA-F]{64})', lambda m:m.group(1)+sha, s)
          s=s.replace('0.20-public-v2','0.20-install-fix')
          s=s.replace('v0.20 PUBLIC V2','v0.20 PUBLIC / INSTALL FIX')
          p.write_text(s)
          Path('downloads/README.md').write_text(
              '# Downloads\n\nCurrent verified public APK:\n\n'
              '`downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk`\n\n'
              f'SHA-256:\n`{sha}`\n\n'
              'This is the exact INSTALL FIX build verified by a real on-device installation test.\n'
              'APK Signature Scheme v2 verified; ZIP alignment verified.\n'
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK" SHA256.txt index.html downloads/README.md
          git commit -m 'Publish verified LIRA8 v0.20 install fix'
          git push origin HEAD:main

