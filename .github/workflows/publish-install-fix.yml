name: Verify LIRA8 published install fix

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  verify-and-fix-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact on-device-tested APK and fix displayed checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk'
          SHA='813cd4325c99f845e294686b1fd93782af48ce87790b9966b52a576897f37d59'
          echo "$SHA  $APK" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          old='0ff3125cce6c7b701160c6d79364fc8d68311ec492ec3f9dc02c56d3d50fa28f'
          new='813cd4325c99f845e294686b1fd93782af48ce87790b9966b52a576897f37d59'
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(old,new)
          p.write_text(s)
          PY
          printf '%s  %s\n' "$SHA" "$APK" > SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html SHA256.txt
          if git diff --cached --quiet; then
            echo 'Metadata already correct.'
          else
            git commit -m 'Fix displayed LIRA8 install-fix checksum'
            git push origin HEAD:main
          fi
