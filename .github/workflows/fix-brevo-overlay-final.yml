name: Fix LIRA8 Brevo overlay final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-brevo-overlay-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix overlay coverage without touching email label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('top:138px;height:72px;background:#fff', 'top:138px;height:100px;background:#fff', 1)
          s=s.replace('top:140px;height:82px;font-size:16px', 'top:140px;height:108px;font-size:16px', 1)
          s=s.replace('top:138px;height:94px;font-size:15px', 'top:138px;height:118px;font-size:15px', 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'top:140px;height:108px;font-size:16px' index.html
          grep -Fq 'top:138px;height:118px;font-size:15px' index.html
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-brevo-overlay-final.yml
          git config user.name 'exsiderurgica'
          git config user.email 'exsiderurgica@gmail.com'
          git add index.html .github/workflows/fix-brevo-overlay-final.yml
          git commit -m 'Finish LIRA8 Brevo paragraph masking'
          git push origin main
