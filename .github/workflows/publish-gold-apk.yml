name: Publish LIRA8 GOLD APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gold-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged signature payload text
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, pathlib, string
          allowed=set(string.ascii_letters+string.digits+'+/=')
          bad_any=False
          for stem in ('manifest','sf','rsa'):
              parts=sorted(glob.glob(f'.release-signatures/{stem}.b64.part*'))
              s=''.join(pathlib.Path(p).read_text().strip() for p in parts)
              bad=[(i,c,ord(c)) for i,c in enumerate(s) if c not in allowed]
              print(stem, 'length', len(s), 'parts', [(p, len(pathlib.Path(p).read_text().strip())) for p in parts])
              print(stem, 'bad', bad)
              bad_any |= bool(bad)
          raise SystemExit(1 if bad_any else 0)
          PY
