name: Publish LIRA8 public APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gold-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Build and verify public APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          OUT='downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk'
          STAGE='.release-public-v020'
          test -s "$SRC"
          test -s "$STAGE/site-MANIFEST.MF"
          test -s "$STAGE/site-LIRA8-RE.SF"

          mkdir -p build-public
          base64 -d "$STAGE/AndroidManifest.xml.b64" > build-public/AndroidManifest.xml
          cp "$STAGE/site-MANIFEST.MF" build-public/MANIFEST.MF
          cp "$STAGE/site-LIRA8-RE.SF" build-public/LIRA8-RE.SF
          base64 -d "$STAGE/site-LIRA8-RE.RSA.b64" > build-public/LIRA8-RE.RSA

          echo 'e1791597be6ae88d645ac22e158ec3c4038d68a6c0b5f77822422660f313b127  build-public/AndroidManifest.xml' | sha256sum -c -
          echo '1f7ad4a4489edea027d1cdc2e25b9e5120ebf4a86d4187ce6520581a7a9c4fa8  build-public/LIRA8-RE.SF' | sha256sum -c -
          echo '2f0c59b5f396de0d9ea2729e884a0475b344a8835d445ea13fcd70b8288e474b  build-public/LIRA8-RE.RSA' | sha256sum -c -

          python3 - <<'PY'
          import zipfile, pathlib

          src=pathlib.Path('downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk')
          out=pathlib.Path('downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk')
          manifest=pathlib.Path('build-public/AndroidManifest.xml').read_bytes()
          signatures={
              'META-INF/MANIFEST.MF': pathlib.Path('build-public/MANIFEST.MF').read_bytes(),
              'META-INF/LIRA8-RE.SF': pathlib.Path('build-public/LIRA8-RE.SF').read_bytes(),
              'META-INF/LIRA8-RE.RSA': pathlib.Path('build-public/LIRA8-RE.RSA').read_bytes(),
          }

          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for zi in zin.infolist():
                  up=zi.filename.upper()
                  if up.startswith('META-INF/') and (up == 'META-INF/MANIFEST.MF' or up.endswith(('.SF','.RSA','.DSA','.EC'))):
                      continue
                  data = manifest if zi.filename == 'AndroidManifest.xml' else zin.read(zi.filename)
                  nzi=zipfile.ZipInfo(zi.filename, date_time=zi.date_time)
                  nzi.compress_type=zi.compress_type
                  nzi.comment=zi.comment
                  nzi.extra=zi.extra
                  nzi.create_system=zi.create_system
                  nzi.external_attr=zi.external_attr
                  nzi.internal_attr=zi.internal_attr
                  nzi.flag_bits=zi.flag_bits
                  zout.writestr(nzi,data)
              for arc,data in signatures.items():
                  zout.writestr(arc,data,compress_type=zipfile.ZIP_DEFLATED)
          PY

          unzip -p "$OUT" AndroidManifest.xml | sha256sum | grep -q '^e1791597be6ae88d645ac22e158ec3c4038d68a6c0b5f77822422660f313b127 '
          jarsigner -verify -verbose -certs "$OUT" > build-public/verify.txt 2>&1
          grep -q 'jar verified' build-public/verify.txt
          unzip -l "$OUT" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$OUT" | grep -q 'lib/arm64-v8a/'
          unzip -l "$OUT" | grep -q 'lib/x86/'
          unzip -l "$OUT" | grep -q 'lib/x86_64/'
          sha256sum "$OUT" | awk '{print $1}' > build-public/new_sha.txt

      - name: Update public site metadata
        shell: bash
        run: |
          set -euo pipefail
          NEW='LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk'
          SHA="$(cat build-public/new_sha.txt)"
          printf '%s  downloads/%s\n' "$SHA" "$NEW" > SHA256.txt

          python3 - "$SHA" <<'PY'
          import pathlib, re, sys
          sha=sys.argv[1]
          p=pathlib.Path('index.html')
          s=p.read_text()
          s=s.replace('LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk','LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk')
          s=re.sub(r'(?i)0\.20-screenrec-(?:stable|dev4)', '0.20-public', s)
          s=s.replace('GOLD v0.20 SCREENREC build.','GOLD v0.20 PUBLIC build.')
          s=re.sub(r'(?i)(SHA-256[^0-9a-fA-F]*)([0-9a-fA-F]{64})', lambda m: m.group(1)+sha, s)
          p.write_text(s)

          pathlib.Path('downloads/README.md').write_text(
              '# Downloads\n\nCurrent public stable APK:\n\n'
              '`downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk`\n\n'
              'SHA-256:\n`'+sha+'`\n\n'
              'Android 9+ (API 28), universal APK: armeabi-v7a, arm64-v8a, x86, x86_64.\n'
              'Public package: `com.exsiderurgica.lira8`; non-debuggable release manifest.\n'
              'Signed with the dedicated Exsiderurgica LIRA8 release certificate.\n\n'
              'The website download button points directly to this file.\n'
          )
          PY

      - name: Publish fixed public APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk downloads/README.md SHA256.txt index.html
          git commit -m 'Publish LIRA8 v0.20 proper public release'
          git push origin HEAD:main
