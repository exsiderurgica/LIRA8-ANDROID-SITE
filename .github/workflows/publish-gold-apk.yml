name: Publish LIRA8 GOLD APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gold-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download validated v0.20 rebuild
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o validation.zip 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-fa78-820a-a532-b56b2aa2c8dd/raw?se=2026-10-11T00%3A17%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=85f3de84-073e-5979-9461-a8b0e84a33ca&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A27%3A33Z&ske=2026-10-11T23%3A27%3A33Z&sks=b&skv=2026-02-06&sig=2VS9tob4p7GTFOBEGU1j/pocwxP889Gd5OFcHEuEI5E%3D'
          rm -rf validation
          mkdir validation
          unzip -q validation.zip -d validation
          test -s validation/LIRA8-v0.20-REBUILD-VALIDATION.apk
          echo 'c8a64e1798c32e0a0dd4460502a8a9fb1e319e68dbf9918c5c2e8235d87b2ab4  validation/LIRA8-v0.20-REBUILD-VALIDATION.apk' | sha256sum -c -

      - name: Repack with GOLD signer identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sig downloads
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib, string

          # One staging chunk lost one base64 character while being committed.
          # Repair it deterministically against the known Git blob SHA of the exact local chunk.
          p=pathlib.Path('.release-signatures/manifest.b64.part02')
          s=p.read_text().strip()
          target='6606d48ea75759b53e729d8aeed5669944ff1817'
          def blob_sha(text):
              b=text.encode()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob_sha(s) != target:
              alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+'+/='
              fixed=None
              for i in range(len(s)+1):
                  for c in alphabet:
                      cand=s[:i]+c+s[i:]
                      if blob_sha(cand) == target:
                          fixed=cand
                          print('Repaired staged manifest chunk at index', i)
                          break
                  if fixed is not None:
                      break
              if fixed is None:
                  raise SystemExit('Could not repair manifest staging chunk')
              p.write_text(fixed)

          specs=[
              ('manifest','sig/MANIFEST.MF','d72bc873821d32465962d199b8f40d1f87e94a749ff5786cad9eb85db3e611a7'),
              ('sf','sig/TTG-RELE.SF','58c8508343d3f25547b953ebd56cad18ce4a670afbbaf5150f5a835bca1776ab'),
              ('rsa','sig/TTG-RELE.RSA','2849b51506c94c4fc8bb3f83a6cdc7d10b4b36a2bf0bffbf01834f298942f8a9'),
          ]
          for stem,out,expected in specs:
              parts=sorted(glob.glob(f'.release-signatures/{stem}.b64.part*'))
              raw=''.join(pathlib.Path(x).read_text().strip() for x in parts)
              data=base64.b64decode(raw, validate=True)
              got=hashlib.sha256(data).hexdigest()
              print(stem, len(raw), len(data), got)
              if got != expected:
                  raise SystemExit(f'{stem} signature payload checksum mismatch')
              pathlib.Path(out).write_bytes(data)
          PY

          python3 - <<'PY'
          import zipfile
          src='validation/LIRA8-v0.20-REBUILD-VALIDATION.apk'
          out='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for zi in zin.infolist():
                  up=zi.filename.upper()
                  if up.startswith('META-INF/') and (up == 'META-INF/MANIFEST.MF' or up.endswith(('.SF','.RSA','.DSA','.EC'))):
                      continue
                  data=zin.read(zi.filename)
                  nzi=zipfile.ZipInfo(zi.filename, date_time=zi.date_time)
                  nzi.compress_type=zi.compress_type
                  nzi.comment=zi.comment
                  nzi.extra=zi.extra
                  nzi.create_system=zi.create_system
                  nzi.external_attr=zi.external_attr
                  nzi.internal_attr=zi.internal_attr
                  nzi.flag_bits=zi.flag_bits
                  zout.writestr(nzi,data)
              for arc,path in [
                  ('META-INF/MANIFEST.MF','sig/MANIFEST.MF'),
                  ('META-INF/TTG-RELE.SF','sig/TTG-RELE.SF'),
                  ('META-INF/TTG-RELE.RSA','sig/TTG-RELE.RSA'),
              ]:
                  zout.writestr(arc, open(path,'rb').read(), compress_type=zipfile.ZIP_DEFLATED)
          PY

          if ! jarsigner -verify -verbose -certs downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk > verify.txt 2>&1; then
            cat verify.txt
            exit 1
          fi
          grep -q 'jar verified' verify.txt
          sha256sum downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk | awk '{print $1}' > new_sha.txt

      - name: Update site metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          SHA="$(cat new_sha.txt)"
          printf '%s  downloads/%s\n' "$SHA" "$APK" > SHA256.txt
          python3 - "$SHA" <<'PY'
          import sys, pathlib, re
          sha=sys.argv[1]
          p=pathlib.Path('index.html')
          s=p.read_text()
          s=re.sub(r'(?i)(SHA-?256[^0-9a-f]*)([0-9a-f]{64})', lambda m:m.group(1)+sha, s)
          s=s.replace('2fc289353fc86d1f27d9172e4be207763974dbc920659cd1d8516f876f10a4ae',sha)
          p.write_text(s)
          PY

      - name: Publish APK to the site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk SHA256.txt index.html
          git commit -m 'Publish LIRA8 GOLD v0.20 SCREENREC APK'
          git push origin HEAD:main
