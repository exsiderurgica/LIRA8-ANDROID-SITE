name: Publish LIRA8 GOLD APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gold-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download validated v0.20 rebuild
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o validation.zip 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5cf8-820a-805e-5435f1c399f7/raw?se=2026-10-11T00%3A05%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=cc1f1fff-0fb0-51d8-a5fb-bee9ddcc2d65&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T01%3A46%3A32Z&ske=2026-10-11T01%3A46%3A32Z&sks=b&skv=2026-02-06&sig=TROgtnS7GyOUTfi4R8e5molmrCCYUJfigjM33o8PDxw%3D'
          rm -rf validation
          mkdir validation
          unzip -q validation.zip -d validation
          test -s validation/LIRA8-v0.20-REBUILD-VALIDATION.apk
          echo 'c8a64e1798c32e0a0dd4460502a8a9fb1e319e68dbf9918c5c2e8235d87b2ab4  validation/LIRA8-v0.20-REBUILD-VALIDATION.apk' | sha256sum -c -

      - name: Repack with GOLD signer identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sig downloads
          cat .release-signatures/manifest.b64.part* | tr -d '\n' | base64 -d > sig/MANIFEST.MF
          cat .release-signatures/sf.b64.part* | tr -d '\n' | base64 -d > sig/TTG-RELE.SF
          cat .release-signatures/rsa.b64.part* | tr -d '\n' | base64 -d > sig/TTG-RELE.RSA
          python3 - <<'PY'
          import zipfile, os
          src='validation/LIRA8-v0.20-REBUILD-VALIDATION.apk'
          out='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for zi in zin.infolist():
                  up=zi.filename.upper()
                  if up.startswith('META-INF/') and (up == 'META-INF/MANIFEST.MF' or up.endswith(('.SF','.RSA','.DSA','.EC'))):
                      continue
                  data=zin.read(zi.filename)
                  nzi=zipfile.ZipInfo(zi.filename, date_time=zi.date_time)
                  nzi.compress_type=zi.compress_type
                  nzi.comment=zi.comment
                  nzi.extra=zi.extra
                  nzi.create_system=zi.create_system
                  nzi.external_attr=zi.external_attr
                  nzi.internal_attr=zi.internal_attr
                  nzi.flag_bits=zi.flag_bits
                  zout.writestr(nzi,data)
              for arc,path in [
                  ('META-INF/MANIFEST.MF','sig/MANIFEST.MF'),
                  ('META-INF/TTG-RELE.SF','sig/TTG-RELE.SF'),
                  ('META-INF/TTG-RELE.RSA','sig/TTG-RELE.RSA'),
              ]:
                  zout.writestr(arc, open(path,'rb').read(), compress_type=zipfile.ZIP_DEFLATED)
          PY
          jarsigner -verify -verbose -certs downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk > verify.txt 2>&1
          grep -q 'jar verified' verify.txt
          unzip -p downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk AndroidManifest.xml | strings -el | grep -q 'com.exsiderurgica.lira8probe'
          unzip -p downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk AndroidManifest.xml | strings -el | grep -q '0.20-screenrec-dev4'
          sha256sum downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk
          sha256sum downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk | awk '{print $1}' > new_sha.txt

      - name: Update site metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          SHA="$(cat new_sha.txt)"
          printf '%s  downloads/%s\n' "$SHA" "$APK" > SHA256.txt
          python3 - "$SHA" <<'PY'
          import sys, pathlib
          sha=sys.argv[1]
          p=pathlib.Path('index.html')
          s=p.read_text()
          s=s.replace('2fc289353fc86d1f27d9172e4be207763974dbc920659cd1d8516f876f10a4ae',sha)
          p.write_text(s)
          PY

      - name: Publish APK to the site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk SHA256.txt index.html
          git commit -m 'Publish LIRA8 GOLD v0.20 SCREENREC APK'
          git push origin HEAD:main
