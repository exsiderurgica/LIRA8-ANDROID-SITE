name: Publish LIRA8 v0.25 GOLD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v025-gold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download validated v0.25 GOLD artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-1364-81f4-a2ef-79829cb6c1d6/raw?se=2026-10-13T13%3A15%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=5834aa33-fd5d-5fc3-967b-86528f2c5a88&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T04%3A40%3A26Z&ske=2026-10-14T04%3A40%3A26Z&sks=b&skv=2026-02-06&sig=k1uXY5Y/q3Oy441VOv%2BYuA6oRW4w19s2AsdpIWHkpZo%3D'
          curl -L --fail --retry 3 "$URL" -o /tmp/lira8-v025-artifact.zip
          rm -rf /tmp/lira8-v025 && mkdir -p /tmp/lira8-v025
          unzip -q /tmp/lira8-v025-artifact.zip -d /tmp/lira8-v025
          SRC="$(find /tmp/lira8-v025 -type f -name '*.apk' | head -n 1)"
          test -n "$SRC"
          echo '9e18baa7e423ade5c0ad3a2dff98aea1ac6e785b859b58846af34b76666aeacc  '"$SRC" | sha256sum -c -
          cp "$SRC" downloads/LIRA8-ANDROID-v0.25-GOLD.apk
          unzip -t downloads/LIRA8-ANDROID-v0.25-GOLD.apk >/dev/null

      - name: Update site to v0.25 GOLD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_sha='b24b6b76a1787328fca70f795784a6d1b5d3fbd74dc06d3b414d0af7035295ae'
          new_sha='9e18baa7e423ade5c0ad3a2dff98aea1ac6e785b859b58846af34b76666aeacc'
          old_file='LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk'
          new_file='LIRA8-ANDROID-v0.25-GOLD.apk'

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
              'GOLD v0.20 PUBLIC build.':'GOLD v0.25 PUBLIC build.',
              '<span class="dot"></span> GOLD v0.20':'<span class="dot"></span> GOLD v0.25',
              '0.20-public / cutout-safe GOLD':'0.25 / EXSJAM2 + layout-lift GOLD',
              old_file:new_file,
              old_sha:new_sha,
              'v0.20 PUBLIC cutout-safe is the current GOLD baseline for public distribution.':'v0.25 is the current GOLD baseline for public distribution, with EXSJAM2 audio-only Wi-Fi transport and improved bottom-screen clearance.',
              'v0.20 PUBLIC cutout-safe è la baseline GOLD attuale per la distribuzione pubblica.':'v0.25 è la baseline GOLD attuale per la distribuzione pubblica, con trasporto audio-only Wi-Fi EXSJAM2 e maggiore spazio dai comandi Android inferiori.',
              'GOLD v0.20 PUBLIC — Giorgio Cerrato + Filippo Belperio':'GOLD v0.25 PUBLIC — Giorgio Cerrato + Filippo Belperio',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing expected site token: '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          Path('SHA256.txt').write_text(new_sha+'  downloads/'+new_file+'\n',encoding='utf-8')
          Path('downloads/README.md').write_text(
              '# Downloads\n\nCurrent public stable GOLD APK:\n\n'
              '`downloads/'+new_file+'`\n\n'
              'SHA-256:\n`'+new_sha+'`\n\n'
              'Version: `0.25-exs-jam-tcp-oboe-layout-lift`.\n\n'
              'GOLD scope: v0.20 cutout-safe baseline, EXSJAM2 audio-only Wi-Fi transport, '
              'Android 9+ Oboe output capture, and 28 dp panel lift while preserving the 58 dp top cutout reserve.\n\n'
              'The website download button points directly to this file.\n',
              encoding='utf-8'
          )
          PY

      - name: Verify published metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GOLD v0.25' index.html
          grep -Fq 'LIRA8-ANDROID-v0.25-GOLD.apk' index.html
          grep -Fq '9e18baa7e423ade5c0ad3a2dff98aea1ac6e785b859b58846af34b76666aeacc' index.html
          grep -Fq 'LIRA8-ANDROID-v0.25-GOLD.apk' SHA256.txt
          sha256sum downloads/LIRA8-ANDROID-v0.25-GOLD.apk | grep -Fq '9e18baa7e423ade5c0ad3a2dff98aea1ac6e785b859b58846af34b76666aeacc'

      - name: Publish v0.25 GOLD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-v0.25-GOLD.apk downloads/README.md SHA256.txt index.html
          git commit -m 'Publish LIRA8 v0.25 GOLD'
          git push origin HEAD:main
