name: Emergency rollback to installable LIRA8 GOLD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-rollback-installable-gold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GOLD APK and restore it as public download
        shell: bash
        run: |
          set -euo pipefail
          APK='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk'
          test -s "$APK"

          # Android 11+ requires APK Signature Scheme v2+ for apps targeting API 30+.
          # The known-good GOLD file contains an APK signing block; do not repack it.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk')
          b=p.read_bytes()
          if b'APK Sig Block 42' not in b:
              raise SystemExit('Known-good GOLD APK does not contain a v2+ APK signing block')
          print('GOLD APK signing block present')
          PY

          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$APK" > SHA256.txt

          python3 - "$SHA" <<'PY'
          from pathlib import Path
          import re, sys
          sha=sys.argv[1]
          p=Path('index.html')
          s=p.read_text()

          # Restore the exact known-good APK bytes. Do NOT rebuild/repack the APK.
          s=re.sub(r"const APK_URL='[^']+';", "const APK_URL='downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk';", s)
          s=re.sub(r"const APK_NAME='[^']+';", "const APK_NAME='LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk';", s)
          s=s.replace('LIRA8-ANDROID-v0.20-PUBLIC-RELEASE.apk','LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk')
          s=s.replace('GOLD / PUBLIC','GOLD / STABLE')
          s=s.replace('0.20-public','0.20-screenrec-stable')
          s=s.replace('v0.20 PUBLIC','v0.20 SCREENREC')
          # Replace every visible SHA-256 value with the real hash of the restored APK.
          s=re.sub(r'(?i)(SHA-256[^0-9a-fA-F]*)([0-9a-fA-F]{64})', lambda m: m.group(1)+sha, s)
          s=re.sub(r'(?i)(SHA-256:\s*)([0-9a-fA-F]{64})', lambda m: m.group(1)+sha, s)
          p.write_text(s)

          Path('downloads/README.md').write_text(
              '# Downloads\n\nCurrent public stable APK (emergency rollback to known-good installable build):\n\n'
              '`downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk`\n\n'
              'SHA-256:\n`'+sha+'`\n\n'
              'This exact APK is preserved byte-for-byte because it already contains a valid APK Signature Scheme v2+ signing block.\n'
              'Do not repack or JAR-sign this file: doing so strips the v2+ signature and breaks installation on Android 11+ when targeting API 30+.\n'
          )
          PY

      - name: Commit rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html SHA256.txt downloads/README.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Emergency rollback to installable LIRA8 GOLD APK'
            git push origin HEAD:main
          fi
