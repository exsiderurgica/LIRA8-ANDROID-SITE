name: Reconstruct LIRA8 GOLD APK

on:
  push:
    branches: [main]
    paths:
      - '.release-parts/**'
      - '.github/workflows/reconstruct-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Reconstruct APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cat .release-parts/apk.b64.part-* | base64 -d > downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk
          echo '2fc289353fc86d1f27d9172e4be207763974dbc920659cd1d8516f876f10a4ae  downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk' | sha256sum -c -

      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LIRA8-ANDROID-ONE-SHOT-v0.20-SCREENREC-GOLD.apk
          if git diff --cached --quiet; then
            echo 'APK already published.'
          else
            git commit -m 'Publish LIRA8 GOLD v0.20 SCREENREC APK'
            git push origin HEAD:main
          fi
