name: Finalize LIRA8 v0.27 GOLD site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v027-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Update current GOLD metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('GOLD v0.25 PUBLIC build.', 'GOLD v0.27 PUBLIC build.'),
              ('GOLD v0.25</div>', 'GOLD v0.27</div>'),
              ('<span>0.25 / EXSJAM2 + layout-lift GOLD</span>', '<span>0.27 / responsive safe-area + SWITCH labels GOLD</span>'),
              ('LIRA8-ANDROID-v0.25-GOLD.apk', 'LIRA8-ANDROID-v0.27-GOLD.apk'),
              ('9e18baa7e423ade5c0ad3a2dff98aea1ac6e785b859b58846af34b76666aeacc', 'ff4785d811fc94aabfd24a5ec1d7a5cc4e0b7f193d7c568313f33d3a98d98f79'),
              ('v0.25 is the current GOLD baseline for public distribution, with EXSJAM2 audio-only Wi-Fi transport and improved bottom-screen clearance.', 'v0.27 is the current GOLD baseline for public distribution, with EXSJAM2 audio-only Wi-Fi transport, responsive safe-area layout for phones and tablets, and cleaned-up SWITCH routing labels.'),
              ('v0.25 è la baseline GOLD attuale per la distribuzione pubblica, con trasporto audio-only Wi-Fi EXSJAM2 e maggiore spazio dai comandi Android inferiori.', 'v0.27 è la baseline GOLD attuale per la distribuzione pubblica, con trasporto audio-only Wi-Fi EXSJAM2, layout responsive con aree sicure per telefoni e tablet e label SWITCH ripulite.'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected site string: {old}')
              s = s.replace(old, new)
              print(f'updated {count} occurrence(s): {old[:70]}')
          if 'LIRA8-ANDROID-v0.25-GOLD.apk' in s:
              raise SystemExit('old GOLD download filename still present')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-shot publication workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/publish-v027-gold-binary.yml
          git rm -f .github/workflows/finalize-v027-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set LIRA8 v0.27 as current GOLD on site'
          git push origin HEAD:main
